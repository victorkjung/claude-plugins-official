# Property & leasing docs. Listings and other marketing copy belong to the `outbound` preset.
name: property
title: Property & leasing docs
description: Leases and amendments, rental applications, inspection and maintenance reports, tenant notices, and vendor contracts.
document_kind: >-
  A property-management or real-estate operations document, such as a residential or commercial
  lease or lease amendment, a rental application, a move-in, move-out, or inspection report, a
  maintenance work order, a notice to a tenant, or a vendor or service contract.
audience: >-
  The tenants, applicants, owners, vendors, and property managers who must rely on the document
  or act on it.

policy:
  pass_at: 75
  fail_below: 50
  min_confidence: 0.5

dimensions:
  clarity:
    label: Clarity
    group: quality
    type: score
    weight: 1.0
    instructions: >-
      How clearly does `document.text` state what each party gets, owes, and must do? Judge the
      wording only, not whether the terms are favorable to anyone.
    criteria:
      - Obligations and terms are confusing or contradictory; a reader could not tell who must do what.
      - Several key terms are ambiguous or buried in dense language; readers would need to ask for clarification before relying on them.
      - Most terms are understandable, but a few important points such as fees, responsibilities, or conditions can be read more than one way.
      - Terms are plainly worded, with only minor ambiguities that are unlikely to cause a dispute.
      - Every obligation, amount, and condition is stated plainly and unambiguously; a non-expert understands it on first read.

  completeness:
    label: Completeness
    group: quality
    type: score
    weight: 1.5
    instructions:
      task: >-
        How complete is `document.text` for the kind of property document it is? Compare it with
        the elements expected for that kind of document.
      expected_elements:
        lease: [parties, premises or unit, term dates, rent amount and due date, security deposit, fees and late charges, utilities, maintenance and repair responsibilities, entry and notice rules, renewal and termination, signatures]
        rental_application: [applicant identity and contact, current and prior addresses, employment and income, rental history and references, occupants and pets, consent to screening, signature and date]
        inspection_or_work_order: [property and unit, date and inspector or requester, condition findings by area, photo or evidence references, required actions with owners and deadlines]
        tenant_notice: [recipient and unit, date, the issue or change, the lease clause or rule it relies on, what the tenant must do, deadline, consequences, contact]
        vendor_contract: [parties, scope of work, price and payment terms, schedule, insurance and licensing, warranties, termination, signatures]
      judge: Judge the presence and adequacy of the expected elements, not whether the terms are favorable.
    criteria:
      - Most expected elements are missing; the document could not serve its purpose.
      - Several essential elements are missing, such as the rent amount, dates, parties, or scope of work.
      - The essentials are present, but multiple standard elements are missing or only implied.
      - Nearly complete; one or two secondary elements are missing or thin.
      - Every essential and standard element for this kind of document is present.

  specificity:
    label: Specificity
    group: quality
    type: score
    weight: 1.0
    instructions: >-
      How precise and verifiable are the facts in `document.text`, such as exact dates, dollar
      amounts, unit identifiers, deadlines, and named responsible parties, rather than vague phrases
      like "a reasonable fee" or "as soon as possible"?
    criteria:
      - Almost no concrete figures, dates, or named parties; nearly everything is vague or left blank.
      - A few specifics, but most amounts, dates, or responsibilities are vague, missing, or left as blanks to fill in.
      - Key figures are present, but several important deadlines, amounts, or responsible parties are vague.
      - Specific and verifiable throughout, with only minor vague spots.
      - Every amount, date, deadline, location, and responsible party is exact and verifiable.

  audience_fit:
    label: Audience fit
    group: audience
    type: score
    weight: 0.75
    instructions: >-
      How well does `document.text` serve the readers described in
      `evaluation_context.intended_audience`? Does it give them the information they need, in terms
      they understand, without assuming knowledge they lack?
    criteria:
      - Written for the wrong reader; the intended audience would not get what they need.
      - Serves the audience poorly; it ignores important reader needs or assumes expertise they lack.
      - Partly serves the audience; some needed explanations or context are missing.
      - Serves the audience well, with minor gaps.
      - Precisely tailored; it anticipates the audience's questions and answers them in their terms.

  readability:
    label: Readability
    group: audience
    type: score
    weight: 0.5
    instructions: >-
      How easy is `document.text` to read and scan for the readers in
      `evaluation_context.intended_audience`? Consider sentence length, jargon, and whether headings,
      lists, or tables organize the key terms.
    criteria:
      - Very hard to read; dense walls of text, heavy undefined jargon, and no organization.
      - Hard to read; long, convoluted sentences or jargon hide the key points.
      - Readable with effort; some sections are dense or poorly organized.
      - Easy to read and scan, with a few dense patches.
      - Very easy to read; plain language, logical sections, and key terms easy to find at a glance.

  tone:
    label: Tone
    group: audience
    type: choice
    instructions: Which description best fits the tone that `document.text` takes toward its readers?
    criteria:
      professional: Courteous, neutral, and businesslike.
      friendly: Warm and approachable while staying appropriate for a business document.
      legalistic: Stiff or defensive legal language that obscures the meaning for non-lawyers.
      hostile: Threatening, accusatory, or demeaning toward the reader.
    flag:
      labels: [hostile]
      reason: Tone reads as hostile or threatening toward the reader.

  next_steps:
    label: Next steps
    group: readiness
    type: score
    weight: 1.0
    instructions: >-
      After reading `document.text`, would each party know exactly what to do next and by when,
      such as sign, pay, schedule access, make a repair, move out, or respond?
    criteria:
      - No next steps; readers would not know what action is expected of them.
      - Next steps are implied but unclear, with no owners or deadlines.
      - Some next steps are clear, but important actions lack an owner or a deadline.
      - Next steps, owners, and deadlines are clear, with minor gaps.
      - Every required action has a clear owner, deadline, and method.

  verdict:
    label: Verdict
    group: verdict
    type: choice
    role: verdict
    instructions: >-
      Would a careful property manager send, sign, or file `document.text` as it is now? Judge the
      document itself, not the deal or the people involved.
    criteria:
      approve: Ready to use as is, or with only trivial edits.
      revise: Usable after specific fixes, such as adding missing terms, clarifying clauses, or filling in vague amounts or dates.
      reject: Not usable; it must be rewritten or is missing essential content.
