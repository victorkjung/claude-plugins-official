[project]
name = "typesafe-doc-eval"
version = "0.1.0"
description = "Evaluate documents on multiple dimensions with TypeSafe's System One API."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typesafe-sdk>=0.7.2,<0.8",
    "pydantic>=2.12",
    "pyyaml>=6.0",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "rich>=13.7",
]

[project.scripts]
doc-eval = "typesafe_doc_eval.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "pyright>=1.1.380",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/typesafe_doc_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
